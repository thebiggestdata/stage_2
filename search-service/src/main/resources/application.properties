spring.application.name=search-service

server.port=8082
server.servlet.context-path=/

logging.level.root=INFO
logging.level.com.thebiggestdata.searchservice=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

mongodb.connection-string=mongodb://localhost:27017/
mongodb.inverted-index.database=inverted_index
mongodb.inverted-index.collection=words
mongodb.metadata.database=metadata
mongodb.metadata.collection=books

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method